[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-taste"
version = "0.1.0"
description = "Self-hosted game taste profile and recommendations."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy>=2",
    "alembic",
    "cryptography",
    "argon2-cffi",
    "itsdangerous",
    "httpx",
    "openai",
    "anthropic",
    "google-genai",
    "tavily-python",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*", "migrations/**/*", "prompts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
